<div class="modern-sidebar" [@slideInOut]="isSidebarOpen ? 'in' : 'out'">
  <!-- Brand Header -->
  <div class="sidebar-header">
    <div class="brand-logo">
      <div class="logo-icon">
        <mat-icon>local_hospital</mat-icon>
      </div>
      <div class="brand-text">
        <h2>KORNPASSORN</h2>
        <span>Care Management System</span>
      </div>
    </div>
    
    <!-- ปุ่มปิดสำหรับ mobile -->
    <button class="close-btn-mobile" (click)="closeSidebar.emit()" aria-label="Close sidebar">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Navigation Menu -->
  <nav class="sidebar-nav">
    <div class="nav-section">
      <div class="section-title">MENU</div>
      <div class="nav-items">
        <ng-container *ngFor="let menu of menus">
          <a *ngIf="!menu.children" [routerLink]="menu.route" class="nav-item" routerLinkActive="active"
            (click)="onMenuClick()">
            <mat-icon>{{menu.icon}}</mat-icon>
            <span>{{menu.label}}</span>
          </a>

          <div *ngIf="menu.children" class="nav-item expandable" (click)="toggleSubmenu(menu.label, $event)">
            <div class="nav-item-content">
              <mat-icon>{{menu.icon}}</mat-icon>
              <span>{{menu.label}}</span>
              <mat-icon class="expand-icon" [class.expanded]="isSubmenuExpanded(menu.label)">
                expand_more
              </mat-icon>
            </div>
            <div class="submenu" [class.expanded]="isSubmenuExpanded(menu.label)">
              <a *ngFor="let child of menu.children" [routerLink]="child.route" class="submenu-item"
                routerLinkActive="active" (click)="onMenuClick()">
                <mat-icon>{{child.icon}}</mat-icon>
                <span>{{child.label}}</span>
              </a>
            </div>
          </div>
        </ng-container>
      </div>
    </div>
  </nav>
</div>
