<div class="bg-gray-50 rounded-2xl p-8 shadow max-w-5xl mx-auto border border-gray-200">
  <div class="mb-4 flex items-center justify-between">
    <h2 class="text-xl font-bold text-gray-800">รายชื่อผู้ป่วย</h2>
    <!-- เพิ่มปุ่มถ้าต้องการ -->
    <!-- <button class="px-4 py-2 bg-blue-600 text-white rounded-lg shadow hover:bg-blue-700">+ เพิ่มผู้ป่วย</button> -->
  </div>
  <div class="overflow-x-auto rounded-xl">
    <table mat-table [dataSource]="dataSource" matSort class="min-w-full bg-white rounded-xl shadow">
      <!-- ID -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef class="px-6 py-3 text-left font-semibold text-gray-700 bg-gray-100">ลำดับ</th>
        <td mat-cell *matCellDef="let element" class="px-6 py-4 text-gray-900">{{element.id}}</td>
      </ng-container>
      <!-- Name -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef class="px-6 py-3 text-left font-semibold text-gray-700 bg-gray-100">ชื่อ</th>
        <td mat-cell *matCellDef="let element" class="px-6 py-4 text-gray-900">{{element.name}}</td>
      </ng-container>
      <!-- Age -->
      <ng-container matColumnDef="age">
        <th mat-header-cell *matHeaderCellDef class="px-6 py-3 text-left font-semibold text-gray-700 bg-gray-100">อายุ</th>
        <td mat-cell *matCellDef="let element" class="px-6 py-4 text-gray-900">{{element.age}}</td>
      </ng-container>
      <!-- Gender -->
      <ng-container matColumnDef="gender">
        <th mat-header-cell *matHeaderCellDef class="px-6 py-3 text-left font-semibold text-gray-700 bg-gray-100">เพศ</th>
        <td mat-cell *matCellDef="let element" class="px-6 py-4 text-gray-900">{{element.gender}}</td>
      </ng-container>
      <!-- Appointment Date -->
      <ng-container matColumnDef="appointmentDate">
        <th mat-header-cell *matHeaderCellDef class="px-6 py-3 text-left font-semibold text-gray-700 bg-gray-100">วันที่นัด</th>
        <td mat-cell *matCellDef="let element" class="px-6 py-4 text-gray-900">{{element.appointmentDate}}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns" class="rounded-t-2xl"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"
          class="hover:bg-blue-50 transition border-b border-gray-100 last:border-b-0"></tr>
    </table>
  </div>
  <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons class="mt-4"></mat-paginator>
</div>
