<form [formGroup]="patientForm" (ngSubmit)="submit()" class="space-y-4 max-w-lg mx-auto bg-white p-6 rounded-xl shadow">

  <div>
    <label>รหัสคนไข้</label>
    <input formControlName="patient_code" class="input" required />
  </div>

  <div>
    <label>ชื่อ</label>
    <input formControlName="first_name" class="input" required />
  </div>

  <div>
    <label>นามสกุล</label>
    <input formControlName="last_name" class="input" required />
  </div>

  <div>
    <label>เพศ</label>
    <select formControlName="gender" class="input">
      <option value="">-</option>
      <option value="male">ชาย</option>
      <option value="female">หญิง</option>
      <option value="other">อื่นๆ</option>
    </select>
  </div>

  <div>
    <label>วันเกิด</label>
    <input type="date" formControlName="date_of_birth" class="input" />
  </div>

  <div>
    <label>เบอร์โทร</label>
    <input formControlName="phone" class="input" />
    <div class="text-red-600 text-sm" *ngIf="patientForm.get('phone')?.invalid && patientForm.get('phone')?.touched">
      กรุณากรอกเบอร์โทรให้ถูกต้อง
    </div>
  </div>

  <div>
    <label>Email</label>
    <input formControlName="email" class="input" />
    <div class="text-red-600 text-sm" *ngIf="patientForm.get('email')?.invalid && patientForm.get('email')?.touched">
      กรุณากรอกอีเมลให้ถูกต้อง
    </div>
  </div>

  <div>
    <label>ที่อยู่</label>
    <input formControlName="address" class="input" />
  </div>

  <div>
    <label for="blood_type">กรุ๊ปเลือด</label>
    <p-select formControlName="blood_type" [options]="bloodTypes" optionLabel="label" optionValue="value"
      placeholder="เลือกกรุ๊ปเลือด" styleClass="w-full">
    </p-select>
  </div>

  <button type="submit" class="btn btn-primary" [disabled]="patientForm.invalid">
    บันทึก
  </button>

  <div *ngIf="successMessage" class="text-green-600 mt-2">{{ successMessage }}</div>
  <div *ngIf="errorMessage" class="text-red-600 mt-2">{{ errorMessage }}</div>
</form>
