<div class="dashboard-container p-6 bg-gray-50 min-h-screen">


  <!-- Simple Person Cards -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
    <!-- Card: Active Patients -->
    <app-simple-person-card
      title="คนไข้ที่มารักษา"
      [value]="stats.activePatients"
      subtitle="ผู้ป่วยที่มารับการรักษาวันนี้"
     >
    </app-simple-person-card>

    <!-- Card: Medical Staff -->
    <app-simple-person-card
      title="แพทย์เวรวันนี้"
      [value]="stats.doctorsOnDuty"
      subtitle="แพทย์ที่ปฏิบัติงานในวันนี้"
      iconColor="green"
      status="พร้อมรักษา">
    </app-simple-person-card>

    <!-- Card: Nursing Staff -->
    <app-simple-person-card
      title="พยาบาลเวรวันนี้"
      [value]="stats.nursesOnDuty"
      subtitle="พยาบาลที่ปฏิบัติงานในวันนี้"
      iconColor="pink"
      status="พร้อมดูแล">
    </app-simple-person-card>

    <!-- Card: Patient Queue -->
    <app-simple-person-card
      title="คิวรอตรวจ"
      [value]="stats.waitingQueue"
      subtitle="ผู้ป่วยที่รอการตรวจรักษา"
      iconColor="orange"
      status="รอตรวจ">
    </app-simple-person-card>
  </div>

  <!-- Charts Section -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
    <!-- Gender Distribution Chart -->
    <p-card header="สัดส่วนเพศผู้ป่วย" styleClass="shadow-lg border-0">
      <p-chart type="pie" [data]="patientGenderChart" [options]="{
        responsive: true,
        plugins: {
          legend: {
            position: 'bottom'
          }
        }
      }" width="100%" height="300px"></p-chart>
    </p-card>

    <!-- Monthly Patients Chart -->
    <p-card header="ผู้ป่วยรายเดือน" styleClass="shadow-lg border-0">
      <p-chart type="bar" [data]="monthlyPatientsChart" [options]="{
        responsive: true,
        plugins: {
          legend: {
            display: false
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            ticks: {
              stepSize: 10
            }
          }
        }
      }" width="100%" height="300px"></p-chart>
    </p-card>
  </div>

  <!-- Tables Section -->
  <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
    <!-- Patients Table -->
    <p-card header="ผู้ป่วยวันนี้" styleClass="shadow-lg border-0">
      <p-table [value]="patients" [paginator]="true" [rows]="5" [showCurrentPageReport]="true"
        currentPageReportTemplate="แสดง {first} ถึง {last} จาก {totalRecords} รายการ" styleClass="p-datatable-sm">
        <ng-template pTemplate="header">
          <tr>
            <th>ชื่อ-นามสกุล</th>
            <th>อายุ</th>
            <th>แผนก</th>
            <th>สถานะ</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-patient>
          <tr>
            <td class="font-medium">{{ patient.name }}</td>
            <td>{{ patient.age }} ปี</td>
            <td>{{ patient.department }}</td>
            <td>
              <p-tag [value]="patient.status" [severity]="getStatusSeverity(patient.status)"></p-tag>
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="4" class="text-center py-4 text-gray-500">ไม่มีข้อมูลผู้ป่วย</td>
          </tr>
        </ng-template>
      </p-table>
    </p-card>

    <!-- Finance Records Table -->
    <p-card header="รายการเงินเข้า-ออกล่าสุด" styleClass="shadow-lg border-0">
      <p-table [value]="financeRecords" [paginator]="true" [rows]="5" [showCurrentPageReport]="true"
        currentPageReportTemplate="แสดง {first} ถึง {last} จาก {totalRecords} รายการ" styleClass="p-datatable-sm">
        <ng-template pTemplate="header">
          <tr>
            <th>วันที่</th>
            <th>รายการ</th>
            <th>จำนวนเงิน</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-record>
          <tr>
            <td>{{ record.date }}</td>
            <td>
              <div class="font-medium">{{ record.description }}</div>
              <div class="text-sm text-gray-500">{{ record.category }}</div>
            </td>
            <td [class]="getAmountClass(record.type)">
              {{ formatAmount(record.amount, record.type) }}
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="3" class="text-center py-4 text-gray-500">ไม่มีข้อมูลการเงิน</td>
          </tr>
        </ng-template>
      </p-table>
    </p-card>
  </div>
</div>
