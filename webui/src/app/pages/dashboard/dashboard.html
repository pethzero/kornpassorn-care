<div class="dashboard-container p-6 bg-gray-50 min-h-screen">
  <!-- Simple Person Cards -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
    <app-simple-person-card title="คนไข้ที่มารักษา" [value]="stats.activePatients" subtitle="ผู้ป่วยที่มารับการรักษาวันนี้"></app-simple-person-card>
    <app-simple-person-card title="แพทย์เวรวันนี้" [value]="stats.doctorsOnDuty" subtitle="แพทย์ที่ปฏิบัติงานในวันนี้" iconColor="green" status="พร้อมรักษา"></app-simple-person-card>
    <app-simple-person-card title="พยาบาลเวรวันนี้" [value]="stats.nursesOnDuty" subtitle="พยาบาลที่ปฏิบัติงานในวันนี้" iconColor="pink" status="พร้อมดูแล"></app-simple-person-card>
    <app-simple-person-card title="คิวรอตรวจ" [value]="stats.waitingQueue" subtitle="ผู้ป่วยที่รอการตรวจรักษา" iconColor="orange" status="รอตรวจ"></app-simple-person-card>
  </div>

  <!-- Quick actions -->
  <div class="quick-actions-section mb-8">
    <h2 class="section-title">ทางลัด</h2>
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-6">
      <a
        *ngFor="let action of quickActions; trackBy: trackByQuickAction"
        [routerLink]="action.route"
        class="quick-action-card"
        [ngClass]="action.accent"
      >
        <div class="qa-icon">{{ action.icon }}</div>
        <div class="qa-label">{{ action.label }}</div>
        <div class="qa-desc">{{ action.desc }}</div>
      </a>
    </div>
  </div>

  <!-- Charts Section -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
    <p-card styleClass="beautiful-chart-card">
      <ng-template pTemplate="header">
        <div class="chart-title"><span class="emoji">📊</span> สัดส่วนเพศผู้ป่วย</div>
      </ng-template>
      <p-chart type="pie" [data]="patientGenderChart" [options]="patientGenderChartOptions" style="height:300px"></p-chart>
    </p-card>

    <p-card styleClass="beautiful-chart-card">
      <ng-template pTemplate="header">
        <div class="chart-title"><span class="emoji">📈</span> ผู้ป่วยรายเดือน</div>
      </ng-template>
      <p-chart type="bar" [data]="monthlyPatientsChart" [options]="monthlyPatientsChartOptions" style="height:300px"></p-chart>
    </p-card>
  </div>
</div>
