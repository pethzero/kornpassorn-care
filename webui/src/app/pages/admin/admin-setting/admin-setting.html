<!-- settings.html -->
<div class="max-w-3xl mx-auto p-6 bg-white rounded-xl shadow space-y-8">
  <div class="flex items-center gap-3 mb-6">
    <span class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-blue-100 text-blue-600">
      <i class="fa-solid fa-gear text-2xl"></i>
    </span>
    <div>
      <h1 class="text-2xl font-bold">ตั้งค่าระบบ</h1>
      <p class="text-gray-500">จัดการผู้ใช้และการตั้งค่าระบบ (Admin เท่านั้น)</p>
    </div>
  </div>

  <!-- Section: จัดการผู้ใช้ -->
  <div class="bg-gray-50 rounded-lg p-6 shadow-sm">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-semibold flex items-center gap-2">
        <i class="fa-solid fa-users-cog text-blue-500"></i>
        จัดการผู้ใช้
      </h2>
      <button class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition">
        + เพิ่มผู้ใช้
      </button>
    </div>
    <div class="overflow-x-auto">
      <table class="min-w-full text-sm">
        <thead>
          <tr class="bg-gray-100 text-gray-700">
            <th class="py-2 px-4 text-left">ชื่อผู้ใช้</th>
            <th class="py-2 px-4 text-left">อีเมล</th>
            <th class="py-2 px-4 text-left">สิทธิ์</th>
            <th class="py-2 px-4 text-left">สถานะ</th>
            <th class="py-2 px-4"></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="py-2 px-4">admin</td>
            <td class="py-2 px-4">admin&#64;example.com</td>
            <td class="py-2 px-4">Admin</td>
            <td class="py-2 px-4"><span class="text-green-600 font-medium">Active</span></td>
            <td class="py-2 px-4">
              <button class="text-blue-600 hover:underline">แก้ไข</button>
              <button class="text-red-500 hover:underline ml-2">ลบ</button>
            </td>
          </tr>
          <!-- เพิ่ม row ตามข้อมูลจริง -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Section: ตั้งค่าทั่วไป -->
  <div class="bg-gray-50 rounded-lg p-6 shadow-sm">
    <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
      <i class="fa-solid fa-sliders-h text-blue-500"></i>
      ตั้งค่าทั่วไป
    </h2>
    <div class="space-y-4">
      <div>
        <label class="block text-gray-700 mb-1">ชื่อระบบ</label>
        <input type="text" class="w-full border rounded px-3 py-2" value="Kornpassorn Care" disabled>
      </div>
      <div>
        <label class="block text-gray-700 mb-1">โหมดระบบ</label>
        <select class="w-full border rounded px-3 py-2" disabled>
          <option>Production</option>
          <option>Development</option>
        </select>
      </div>
    </div>
  </div>
</div>
