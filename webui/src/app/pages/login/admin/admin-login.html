<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-100 via-white to-blue-100">
  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-lg space-y-8">

    <!-- โลโก้หรือไอคอน -->
    <div class="flex justify-center">
      <img src="assets/picture/logo.png" alt="Logo" class="h-16 w-16" />
    </div>

    <!-- Admin Access -->
    <div class="text-center space-y-2">
      <h2 class="text-xl font-semibold text-gray-800">เข้าสู่ระบบผู้ดูแลระบบ</h2>
      <p class="text-sm text-gray-500">กรุณาเข้าสู่ระบบด้วยบัญชีผู้ดูแลระบบของคุณ</p>
    </div>

    <!-- Login Form -->
    <form (ngSubmit)="login()" #loginForm="ngForm" class="space-y-4">
      <!-- Username -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อผู้ใช้งาน</label>
        <input [(ngModel)]="username" name="username" required
          class="w-full px-4 py-2 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่าน</label>
        <input [(ngModel)]="password" name="password" type="password" required
          class="w-full px-4 py-2 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <!-- Submit -->
      <button type="submit" [disabled]="!loginForm.form.valid || isSubmitting"
        class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition font-semibold disabled:opacity-50 disabled:cursor-not-allowed">
        {{ isSubmitting ? 'กำลังเข้าสู่ระบบ...' : 'เข้าสู่ระบบ' }}
      </button>

      <!-- Error -->
      <div *ngIf="errorMessage" class="text-red-500 text-sm text-center">
        {{ errorMessage }}
      </div>
    </form>

    <!-- Admin Login Path -->
    <div class="text-center text-sm mt-4">
       <a href="/login" class="text-blue-600 hover:underline">
        สำหรับผู้ใช้ทั่วไป (user portal)
      </a>
    </div>

    <p class="text-center text-gray-400 text-sm mt-6">© 2025 Kornpassorn Care</p>
  </div>
</div>
