<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-teal-100 via-white to-cyan-100">
  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-lg space-y-8">

    <!-- โลโก้หรือไอคอน -->
    <div class="flex justify-center">
      <img src="assets/picture/logo.png" alt="Logo" class="h-16 w-16" />
    </div>

    <div class="text-center space-y-2">
      <h2 class="text-xl font-semibold text-gray-800">เข้าสู่ระบบสำหรับผู้ป่วย</h2>
      <p class="text-sm text-gray-500">
        {{ step === 'phone' ? 'กรอกเบอร์โทรศัพท์เพื่อรับรหัสยืนยัน' : 'กรอกรหัส OTP ที่ส่งไปยัง ' + phone }}
      </p>
    </div>

    <!-- Step 1: Phone -->
    <form *ngIf="step === 'phone'" (ngSubmit)="requestOtp()" #phoneForm="ngForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">เบอร์โทรศัพท์</label>
        <input [(ngModel)]="phone" name="phone" required pattern="^(0|\+66)\d{8,9}$"
          placeholder="0812345678"
          class="w-full px-4 py-2 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-teal-500" />
      </div>

      <button type="submit" [disabled]="!phoneForm.form.valid || isSubmitting"
        class="w-full bg-teal-600 text-white py-2 rounded-md hover:bg-teal-700 transition font-semibold disabled:opacity-50 disabled:cursor-not-allowed">
        {{ isSubmitting ? 'กำลังส่งรหัส...' : 'ขอรหัส OTP' }}
      </button>
    </form>

    <!-- Step 2: OTP -->
    <form *ngIf="step === 'otp'" (ngSubmit)="verifyOtp()" #otpForm="ngForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">รหัส OTP (6 หลัก)</label>
        <input [(ngModel)]="otp" name="otp" required pattern="^\d{6}$" maxlength="6" inputmode="numeric"
          placeholder="123456"
          class="w-full px-4 py-2 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-teal-500 tracking-widest text-center text-lg" />
      </div>

      <div *ngIf="devOtp" class="text-xs text-center text-amber-600 bg-amber-50 border border-amber-200 rounded-md py-2">
        โหมดทดสอบ — รหัส OTP คือ <strong>{{ devOtp }}</strong>
      </div>

      <button type="submit" [disabled]="!otpForm.form.valid || isSubmitting"
        class="w-full bg-teal-600 text-white py-2 rounded-md hover:bg-teal-700 transition font-semibold disabled:opacity-50 disabled:cursor-not-allowed">
        {{ isSubmitting ? 'กำลังเข้าสู่ระบบ...' : 'ยืนยันและเข้าสู่ระบบ' }}
      </button>

      <div class="flex items-center justify-between text-sm">
        <button type="button" (click)="changePhone()" class="text-gray-500 hover:underline">
          เปลี่ยนเบอร์โทร
        </button>
        <button type="button" (click)="requestOtp()" [disabled]="resendCooldown > 0 || isSubmitting"
          class="text-teal-600 hover:underline disabled:text-gray-400 disabled:no-underline disabled:cursor-not-allowed">
          {{ resendCooldown > 0 ? 'ขอรหัสใหม่ได้ใน ' + resendCooldown + ' วิ' : 'ขอรหัสใหม่' }}
        </button>
      </div>
    </form>

    <!-- Error -->
    <div *ngIf="errorMessage" class="text-red-500 text-sm text-center">
      {{ errorMessage }}
    </div>

    <!-- Divider -->
    <div class="relative">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-gray-300"></div>
      </div>
      <div class="relative flex justify-center text-sm">
        <span class="bg-white px-2 text-gray-400">หรือ</span>
      </div>
    </div>

    <div class="text-center text-sm">
      <a href="/login" class="text-teal-600 hover:underline">
        สำหรับเจ้าหน้าที่ (เข้าสู่ระบบด้วยชื่อผู้ใช้)
      </a>
    </div>

    <p class="text-center text-gray-400 text-sm mt-6">© 2025 Kornpassorn Care</p>
  </div>
</div>
