<div class="ls-root" [class.ls-overlay]="overlay">
  <div class="ls-panel">
    <div class="ls-spinner" [ngStyle]="{ 'width.px': size, 'height.px': size }">
      <div class="ls-ring"></div>
      <div class="ls-cross">
        <span></span>
        <span></span>
      </div>
    </div>
    <p class="ls-message" *ngIf="message">{{ message }}</p>
  </div>
</div>
