<p-card [style]="{'width':'250px'}">
  <!-- Header -->
  <ng-template pTemplate="header" *ngIf="headtext">
    <div class="card-header">
      {{ headtext }}
    </div>
  </ng-template>

  <!-- Mid Content -->
  <div class="card-content" *ngIf="midtext">
    <div class="card-mid">
      {{ midtext }}
    </div>
  </div>

  <!-- Footer -->
  <ng-template pTemplate="footer" *ngIf="footxt">
    <div class="card-footer">
      {{ footxt }}
    </div>
  </ng-template>
</p-card>
